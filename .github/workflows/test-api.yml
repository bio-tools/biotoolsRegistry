name: api tests

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-compose:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: start mysql and elasticsearch
      run: docker compose up -d mysql elasticsearch

    - name: wait for mysql
      run: |
        until docker exec biotools-mysql mysqladmin ping -uroot -pelixirroot --silent; do
          sleep 5
        done

    - name: grant mysql privileges
      run: docker exec -i biotools-mysql mysql -u root -pelixirroot -e "GRANT ALL PRIVILEGES ON *.* TO 'elixir'@'%' WITH GRANT OPTION; FLUSH PRIVILEGES;"
    - name: run tests
      run: docker compose run --rm --no-deps backend python manage.py test

    - name: tear down
      run: docker compose down -v
