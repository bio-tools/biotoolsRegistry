# docker-compose file to setup:
# - mysql
# - elasticsearch
# - backend: depends on mysql and elasticsearch
# - caddy: reverse proxy and static files

# This file is meant to aid local development and testing. It *must not* be
# used for production deployment.

services:

  mysql:
    container_name: biotools-mysql
    image: mysql:8.0.43
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=elixirroot
      - MYSQL_DATABASE=elixir
      - MYSQL_USER=elixir
      - MYSQL_PASSWORD=123
    volumes:
      - "data-mysql:/var/lib/mysql"
    ports:
      - "3306:3306"
    networks:
      - net

  elasticsearch:
    container_name: biotools-elasticsearch
    image: elasticsearch:7.12.1
    restart: unless-stopped
    environment:
      - xpack.security.enabled=false
      - discovery.type=single-node
    volumes:
      - "data-elasticsearch:/usr/share/elasticsearch/data"
    ports:
      - "9200:9200"
      - "9300:9300"
    networks:
      - net
    healthcheck:
      test: [ "CMD-SHELL", "curl -fs http://localhost:9200 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    container_name: biotools-backend
    image: biotools/backend:latest
    build:
      context: ./backend
      target: dev
    environment:
      - BIOTOOLS_ELASTIC_SEARCH_URLS=http://elasticsearch:9200
      - BIOTOOLS_URL_FRONT=https://localhost/
      - BIOTOOLS_GITHUB_BRIDGE_URL=${BIOTOOLS_GITHUB_BRIDGE_URL:-}
      - BIOTOOLS_MYSQL_DB=elixir
      - BIOTOOLS_MYSQL_HOST=biotools-mysql
      - BIOTOOLS_MYSQL_PASSWORD=123
      - BIOTOOLS_MYSQL_USER=elixir
      - BIOTOOLS_EMAIL_BACKEND=django.core.mail.backends.console.EmailBackend
      - BIOTOOLS_WSGI_APPLICATION=elixirapp.dev_wsgi.application
      - 'BIOTOOLS_SECURE_PROXY_SSL_HEADER=["HTTP_X_FORWARDED_PROTO","https"]'
      - 'BIOTOOLS_CSRF_TRUSTED_ORIGINS=["https://localhost"]'
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - net
    depends_on:
      mysql:
        condition: service_started
      elasticsearch:
        condition: service_healthy
    links:
      - mysql
      - elasticsearch
    volumes:
      - ./backend:/elixir/application/backend:consistent
      - ./registry-assets:/elixir/application/frontend
      - backend_data:/elixir/application/backend/data # to avoid permission conflicts
      - media_data:/elixir/application/media_cdn

  caddy:
    image: caddy:2
    container_name: biotools-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - media_data:/elixir/application/media_cdn:ro
      - ./backend/runtime/Caddyfile.native-dev:/etc/caddy/Caddyfile:ro
      - ./registry-assets/static:/elixir/application/frontend/static:ro
      - ./registry-assets/resources:/elixir/application/frontend/resources:ro
      - ./registry-assets/img:/elixir/application/frontend/img:ro
      - ./registry-assets/json:/elixir/application/frontend/json:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    networks:
      - net
    restart: unless-stopped

  bridge:
    image: anitamnd/bridge@sha256:d9dc5a5484247b9eedc9e204aea999bcd82fce79e5fea8bdfe4681b50203ec61
    platform: linux/amd64
    profiles: [github-import]
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      HUGGINGFACE_TOKEN: ${HUGGINGFACE_TOKEN:-}
    networks: [net]
    restart: unless-stopped
    mem_limit: 1g
    cpus: 2
    pids_limit: 128

networks:
  net:
    name: biotools-net
    driver: bridge

volumes:
  data-mysql:
  data-elasticsearch:
  caddy_data:
  caddy_config:
  backend_data:
  media_data:
