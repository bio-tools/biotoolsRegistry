{% load detail_tags %}
{% if label %}<span class="edam-term edam-chip" data-edam-scope="{{ scope }}">
  {% if search %}<a href="{{ search }}" title="{{ search_title }}">{{ label }}</a>{% elif definition %}<abbr title="{{ definition }}" tabindex="0">{{ label }}</abbr>{% else %}{{ label }}{% endif %}
  {% if ontology_link %}<small class="edam-link">{{ ontology_link }}</small>{% endif %}
</span>{% endif %}
