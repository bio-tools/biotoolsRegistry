<VirtualHost *:80>
  ServerName localhost
  DocumentRoot /elixir/application/frontend

  Alias /robots.txt /elixir/application/robots/robots-deny-all.txt
  Alias /favicon.ico /elixir/application/frontend/static/html/favicon.ico
  Alias /img/favicon.ico /elixir/application/frontend/static/html/favicon.ico
  Alias /media/ /elixir/application/media_cdn/

  <Directory /elixir/application/frontend>
    Options -Indexes -ExecCGI
    AllowOverride None
    Require all granted
  </Directory>
  <Directory /elixir/application/media_cdn>
    Options -Indexes -ExecCGI
    AllowOverride None
    Require all granted
  </Directory>
  <Directory /elixir/application/robots>
    Require all granted
  </Directory>

  WSGIDaemonProcess el threads=5
  WSGIScriptAlias /api /elixir/application/backend/elixirapp/wsgi.py
  WSGIScriptAlias /_migration/html /elixir/application/backend/elixirapp/html_wsgi.py
  WSGIPassAuthorization On
  <Directory /elixir/application/backend/elixirapp>
    <Files canonical_wsgi.py>
      Options +ExecCGI
      Require all granted
    </Files>
  </Directory>

  RewriteEngine On
  RewriteCond %{REQUEST_URI} !^/(api|_migration/html|static|resources|img|json|media)(/|$)
  RewriteCond %{REQUEST_URI} !^/(robots\.txt|favicon\.ico|img/favicon\.ico)$
  RewriteRule ^/ /elixir/application/backend/elixirapp/canonical_wsgi.py [H=wsgi-script,L]

  <LocationMatch />
    Require all granted
    WSGIScriptReloading On
    WSGIApplicationGroup %{GLOBAL}
  </LocationMatch>
  Header always set Access-Control-Allow-Origin "*"
</VirtualHost>
