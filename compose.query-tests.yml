# Overlay for upstream tests, which mutate the hard-coded elixir/test indexes.
services:
  backend:
    environment:
      BIOTOOLS_ELASTIC_SEARCH_URLS: http://query-test-elasticsearch:9200
  query-test-elasticsearch:
    image: elasticsearch:7.12.1
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      cluster.routing.allocation.disk.watermark.low: 10gb
      cluster.routing.allocation.disk.watermark.high: 7gb
      cluster.routing.allocation.disk.watermark.flood_stage: 5gb
    networks:
      - net
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
