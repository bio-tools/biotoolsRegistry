# docker-compose file to setup:
# - mysql
# - elasticsearch
# - backend: depends on mysql and elasticsearch
# - taskrunner: process background tasks


services:

  mysql:
    container_name: biotools-mysql
    image: mysql:8.0.43
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${BIOTOOLS_MYSQL_ROOT_PASSWORD:?Set the existing MySQL root password}
      - MYSQL_DATABASE=${BIOTOOLS_MYSQL_DB:-elixir}
      - MYSQL_USER=${BIOTOOLS_MYSQL_USER:-elixir}
      - MYSQL_PASSWORD=${BIOTOOLS_MYSQL_PASSWORD:?Set the existing MySQL application password}
    volumes:
      - "data-mysql:/var/lib/mysql"
    ports:
      - "3306:3306"
    networks:
      - net

  elasticsearch:
    container_name: biotools-elasticsearch
    image: elasticsearch:7.12.1
    restart: unless-stopped
    environment:
      - xpack.security.enabled=false
      - discovery.type=single-node
    volumes:
      - "data-elasticsearch:/usr/share/elasticsearch/data"
    ports:
      - "9200:9200"
      - "9300:9300"
    networks:
      - net

  backend:
    container_name: biotools-backend
    image: biotools/backend:latest
    build:
      context: .
      target: prod
    environment:
      - BIOTOOLS_ELASTIC_SEARCH_URLS=${BIOTOOLS_ELASTIC_SEARCH_URLS:-http://elasticsearch:9200}
      - BIOTOOLS_URL_FRONT=${BIOTOOLS_URL_FRONT:-https://bio.tools/}
      - BIOTOOLS_GITHUB_BRIDGE_URL=${BIOTOOLS_GITHUB_BRIDGE_URL:-}
      - BIOTOOLS_DEBUG=${BIOTOOLS_DEBUG:-0}
      - BIOTOOLS_SECRET_KEY=${BIOTOOLS_SECRET_KEY:?Set the deployment secret key}
      - BIOTOOLS_ALLOWED_HOSTS=${BIOTOOLS_ALLOWED_HOSTS:?Set allowed hosts as a JSON array}
      - BIOTOOLS_CSRF_TRUSTED_ORIGINS
      - BIOTOOLS_SESSION_COOKIE_SECURE=${BIOTOOLS_SESSION_COOKIE_SECURE:-1}
      - BIOTOOLS_CSRF_COOKIE_SECURE=${BIOTOOLS_CSRF_COOKIE_SECURE:-1}
      - BIOTOOLS_SECURE_PROXY_SSL_HEADER
      - BIOTOOLS_EMAIL_BACKEND=${BIOTOOLS_EMAIL_BACKEND:?Set the production email backend}
      - BIOTOOLS_EMAIL_HOST
      - BIOTOOLS_EMAIL_PORT
      - BIOTOOLS_EMAIL_USE_SSL
      - BIOTOOLS_EMAIL_USE_TLS
      - BIOTOOLS_EMAIL_HOST_USER
      - BIOTOOLS_EMAIL_HOST_PASSWORD
      - BIOTOOLS_DEFAULT_FROM_EMAIL
      - BIOTOOLS_ORCID_BASE_DOMAIN
      - BIOTOOLS_ORCID_MEMBER_API
      - BIOTOOLS_ORCID_CLIENT_ID
      - BIOTOOLS_ORCID_CLIENT_SECRET
      - BIOTOOLS_ORCID_CALLBACK_URL
      - BIOTOOLS_MIGRATION_PREVIEW_DEMOS=${BIOTOOLS_MIGRATION_PREVIEW_DEMOS:-0}
      - BIOTOOLS_MYSQL_DB=${BIOTOOLS_MYSQL_DB:-elixir}
      - BIOTOOLS_MYSQL_HOST=biotools-mysql
      - BIOTOOLS_MYSQL_PASSWORD=${BIOTOOLS_MYSQL_PASSWORD:?Set the existing MySQL application password}
      - BIOTOOLS_MYSQL_USER=${BIOTOOLS_MYSQL_USER:-elixir}
    ports:
      - "80:80"
    networks:
      - net
    depends_on:
      - mysql
      - elasticsearch
    links:
      - mysql
      - elasticsearch
    volumes:
      - backend_data:/elixir/application/backend/data
      - media_data:/elixir/application/media_cdn

  taskrunner:
    container_name: biotools-taskrunner
    image: biotools/backend:latest
    build:
      context: .
      target: prod
    environment:
      - BIOTOOLS_SECRET_KEY=${BIOTOOLS_SECRET_KEY:?Set the deployment secret key}
      - BIOTOOLS_EMAIL_BACKEND=${BIOTOOLS_EMAIL_BACKEND:?Set the production email backend}
      - BIOTOOLS_EMAIL_HOST
      - BIOTOOLS_EMAIL_PORT
      - BIOTOOLS_EMAIL_USE_SSL
      - BIOTOOLS_EMAIL_USE_TLS
      - BIOTOOLS_EMAIL_HOST_USER
      - BIOTOOLS_EMAIL_HOST_PASSWORD
      - BIOTOOLS_DEFAULT_FROM_EMAIL
      - BIOTOOLS_ELASTIC_SEARCH_URLS=${BIOTOOLS_ELASTIC_SEARCH_URLS:-http://elasticsearch:9200}
      - BIOTOOLS_MYSQL_DB=${BIOTOOLS_MYSQL_DB:-elixir}
      - BIOTOOLS_MYSQL_HOST=biotools-mysql
      - BIOTOOLS_MYSQL_PASSWORD=${BIOTOOLS_MYSQL_PASSWORD:?Set the existing MySQL application password}
      - BIOTOOLS_MYSQL_USER=${BIOTOOLS_MYSQL_USER:-elixir}
    networks:
      - net
    depends_on:
      - mysql
      - elasticsearch
    volumes:
      - backend_data:/elixir/application/backend/data
      - media_data:/elixir/application/media_cdn
    command: python manage.py process_tasks

  bridge:
    image: anitamnd/bridge@sha256:d9dc5a5484247b9eedc9e204aea999bcd82fce79e5fea8bdfe4681b50203ec61
    platform: linux/amd64
    profiles: [github-import]
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      HUGGINGFACE_TOKEN: ${HUGGINGFACE_TOKEN:-}
    networks: [net]
    restart: unless-stopped
    mem_limit: 1g
    cpus: 2
    pids_limit: 128

networks:
  net:
    name: biotools-net

volumes:
  data-mysql:
  data-elasticsearch:
  backend_data:
  media_data:
